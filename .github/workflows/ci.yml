name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    needs: [lint-and-test, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          command: d1 migrations apply anita-invoice-tracker --remote

      # Runs right after migrations and before any other wrangler-action
      # step, including the secret-upload ones below: cloudflare/wrangler-
      # action@v3 defaults to running `wrangler deploy` whenever a step
      # doesn't specify its own `command`, even a step whose only stated
      # job is uploading a secret. That implicit deploy would otherwise
      # fail here with "R2 bucket not found" before this check ever ran,
      # since wrangler.toml's r2_buckets binding needs the bucket to
      # already exist — same "check first, create if missing" shape as
      # the Pages project check further down.
      - name: Ensure R2 bucket exists
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if ! npx wrangler r2 bucket list | grep -q "acm-caseflow-documents"; then
            npx wrangler r2 bucket create acm-caseflow-documents
          fi

      - name: Set session secret
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          secrets: |
            SESSION_SECRET
        env:
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}

      # Client correspondence and case documents are legally privileged, so
      # every uploaded file is encrypted (see documentEncryption.ts) with a
      # key this repo doesn't generate on its own — DOCUMENT_ENCRYPTION_KEY
      # needs to exist as a GitHub Actions secret (a base64-encoded 32-byte
      # value) before Documents actually works in production. Until it's
      # set, the feature reports itself as unconfigured rather than
      # breaking the rest of the app, same as the usage tracking secrets.
      - name: Set document encryption key
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          secrets: |
            DOCUMENT_ENCRYPTION_KEY
        env:
          DOCUMENT_ENCRYPTION_KEY: ${{ secrets.DOCUMENT_ENCRYPTION_KEY }}

      # Correspondence's drafting/review agents (routes/letters.ts) call the
      # Anthropic API directly, which needs its own key — same optional-
      # binding pattern as DOCUMENT_ENCRYPTION_KEY above: until this secret
      # is set, drafting/review report themselves as unconfigured (500)
      # rather than breaking anything else in the app.
      #
      # continue-on-error here (unlike the other secret-upload steps above)
      # because, unlike DOCUMENT_ENCRYPTION_KEY, this secret genuinely does
      # not exist yet the first time this workflow runs after this feature
      # ships — wrangler-action hard-fails a step with "Value for secret ...
      # not found in environment" when the referenced secret has never been
      # created, which would otherwise abort deploy entirely (skipping the
      # Worker/Pages deploy for every feature, not just this one) until the
      # secret is added.
      - name: Set Anthropic API key
        uses: cloudflare/wrangler-action@v3
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          secrets: |
            ANTHROPIC_API_KEY
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      # Reuses the same deploy credentials already used above, rather than
      # asking for a new secret — the Usage panel just needs the Worker's
      # own copy of them to call Cloudflare's Analytics API at runtime.
      # Note: the deploy token needs Account Analytics: Read added to it in
      # the Cloudflare dashboard for the panel to actually return data; the
      # panel reports itself as unconfigured/errors clearly if that's missing
      # rather than failing the whole app.
      - name: Set Cloudflare usage tracking secrets
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          secrets: |
            CF_API_TOKEN
            CF_ACCOUNT_ID
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          command: deploy

      # No VITE_API_URL: the frontend calls relative /api/... paths, which
      # apps/web/functions/api/[[path]].ts proxies to the Worker server-side
      # -- keeping the browser's requests same-origin. See that file for why.
      - name: Build web frontend
        working-directory: apps/web
        run: npm run build

      - name: Ensure Pages project exists
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if ! npx wrangler pages project list | grep -q "anita-invoice-tracker"; then
            npx wrangler pages project create anita-invoice-tracker --production-branch=main
          fi

      - name: Deploy Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          command: pages deploy dist --project-name=anita-invoice-tracker
